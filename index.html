<!doctype html>
<html lang="nl-BE" data-stijl="hoeve" data-achtergrond="standaard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amélie & Michiel · Save the date</title>
  <meta name="description" content="Amélie & Michiel hebben nieuws.">
  <meta property="og:title" content="Amélie & Michiel · Save the date">
  <meta property="og:description" content="Hoe goed ken jij ons? · Nous connais-tu bien ? · How well do you know us? · Wie gut kennst du uns?">
  <meta name="theme-color" content="#EFE8DA">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-style='italic' font-size='40' text-anchor='middle' fill='%233E5C9A'%3E%26amp;%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,300;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Italiana&family=Jost:wght@400;500&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="kop">
    <span class="monogram" aria-hidden="true">A <span class="en">&amp;</span> M</span>
    <nav class="talen" id="talen" aria-label="Taal · Langue · Language · Sprache"></nav>
    <div class="voortgang-lijn" id="voortgang" hidden><i></i></div>
  </header>

  <main>
    <!-- ============ INTRO ============ -->
    <section id="intro" class="scherm actief" aria-labelledby="intro-titel">
      <figure class="intro-foto"><img id="intro-foto" alt=""></figure>
      <div class="intro-inhoud">
        <h1 id="intro-titel" class="intro-titel" data-t-html="introTitel"></h1>
        <div class="krans" data-bot="krans:3"></div>
        <p class="intro-tekst" data-t="introTekst"></p>
        <button class="knop" id="start" data-t="introStart"></button>
        <button class="link-knop" id="overslaan" data-t="introOverslaan" hidden></button>
      </div>
    </section>

    <!-- ============ QUIZ ============ -->
    <section id="quiz" class="scherm" aria-live="polite">
      <div class="vraag-beeld" id="vraag-beeld"></div>
      <div class="vraag-inhoud">
        <p class="label" id="vraag-nr"></p>
        <h2 class="vraag" id="vraag-tekst" tabindex="-1"></h2>
        <p class="vraag-hint" id="vraag-hint"></p>
        <div class="kaart-rij" id="kaart-rij" hidden>
          <div class="kaart-plek" id="kaart-plek"></div>
          <div class="pin-info" id="pin-info" hidden></div>
        </div>
        <div class="antwoorden" id="antwoorden"></div>
        <button class="knop knop-breed" id="toon-antwoord" disabled></button>
        <div class="feedback" id="feedback" hidden>
          <p class="feedback-titel" id="feedback-titel"></p>
          <p class="feedback-tekst" id="feedback-tekst"></p>
          <figure class="feedback-foto" id="feedback-foto" hidden><img alt=""><figcaption></figcaption></figure>
          <button class="knop" id="volgende"></button>
        </div>
      </div>
    </section>

    <!-- ============ ONTHULLING ============ -->
    <section id="onthulling" class="scherm" aria-labelledby="std-namen">

      <article class="std">
        <p class="label std-label">Save the date</p>
        <figure class="std-foto"><img id="kaart-foto" alt=""></figure>
        <p class="std-trouwen" data-t="wijTrouwen"></p>
        <h1 class="std-namen" id="std-namen"></h1>
        <div class="krans" data-bot="krans:4"></div>
        <p class="std-datum" id="std-datum"></p>
        <p class="std-plaats" id="std-plaats"></p>
        <p class="std-noot" data-t="uitnodigingVolgt"></p>
      </article>

      <p class="score" id="score"></p>

      <section class="blok" aria-labelledby="praktisch-titel">
        <h2 id="praktisch-titel" class="blok-titel" data-t="wanneerWaar"></h2>
        <p class="aftellen" id="aftellen"></p>
        <ol class="tijdlijn" id="tijdlijn"></ol>
        <div class="agenda-knoppen">
          <a class="knop knop-klein" id="google-agenda" target="_blank" rel="noopener" data-t="agendaGoogle"></a>
          <button class="knop knop-klein" id="ics" data-t="agendaIcs"></button>
        </div>
      </section>

      <section class="blok" aria-labelledby="form-titel">
        <h2 id="form-titel" class="blok-titel" data-t="formTitel"></h2>
        <p class="blok-intro" data-t="formIntro"></p>

        <form id="formulier" novalidate>
          <label class="veld-invoer">
            <span data-t="formNaam"></span>
            <input name="naam" required autocomplete="name" data-t-ph="formNaamVb">
          </label>
          <label class="veld-invoer">
            <span data-t="formEmail"></span>
            <input name="email" type="email" required autocomplete="email" data-t-ph="formEmailVb">
          </label>

          <fieldset class="veld-invoer">
            <legend data-t="formAanwezig"></legend>
            <div class="keuzes">
              <label class="keuze"><input type="radio" name="aanwezig" value="ja" required><span data-t="formJa"></span></label>
              <label class="keuze"><input type="radio" name="aanwezig" value="misschien"><span data-t="formMisschien"></span></label>
              <label class="keuze"><input type="radio" name="aanwezig" value="nee"><span data-t="formNee"></span></label>
            </div>
          </fieldset>

          <fieldset class="veld-invoer adres">
            <legend><span data-t="formAdres"></span> <small data-t="formAdresUitleg"></small></legend>
            <input name="straat" autocomplete="street-address" data-t-ph="formStraat" data-t-aria="formStraat">
            <div class="adres-rij">
              <input name="postcode" autocomplete="postal-code" data-t-ph="formPostcode" data-t-aria="formPostcode">
              <input name="gemeente" autocomplete="address-level2" data-t-ph="formGemeente" data-t-aria="formGemeente">
            </div>
            <input name="land" autocomplete="country-name" data-t-ph="formLand" data-t-aria="formLandLabel">
          </fieldset>

          <label class="veld-invoer">
            <span><span data-t="formBericht"></span> <small data-t="formOptioneel"></small></span>
            <textarea name="bericht" rows="3"></textarea>
          </label>

          <label class="honing" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>

          <p class="form-melding" id="form-melding" role="status"></p>
          <button class="knop knop-breed" type="submit" id="verstuur" data-t="formVerstuur"></button>
        </form>

        <div class="bedankt" id="bedankt" hidden tabindex="-1">
          <h3 data-t="bedankt"></h3>
          <p id="bedankt-tekst"></p>
        </div>
      </section>

      <footer class="voet">
        <p id="voet-tekst"></p>
        <button class="link-knop" id="opnieuw" data-t="opnieuw"></button>
      </footer>
    </section>
  </main>

  <div class="stijlkiezer" id="stijlkiezer" hidden>
    <div class="rij">
      <span>Stijl</span>
      <button type="button" data-stijl-knop="hoeve">Hoeve</button>
      <button type="button" data-stijl-knop="veldbloemen">Veldbloemen</button>
      <button type="button" data-stijl-knop="blauwe-inkt">Blauwe inkt</button>
    </div>
    <div class="rij">
      <span>Kleur</span>
      <button type="button" data-achtergrond-knop="standaard">Standaard</button>
      <button type="button" data-achtergrond-knop="lichtblauw">Lichtblauw</button>
      <button type="button" data-achtergrond-knop="donkerblauw">Donkerblauw</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/teksten.js"></script>
  <script src="js/botanisch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
